<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOM — enter the room</title><link rel="stylesheet" href="/assets/site.css"></head><body><main class="auth-page"><section class="auth-art"><a class="brand" href="/" style="color:#f7f0e4"><span class="brand-mark" style="border-color:#f7f0e4"></span>LOOM</a><div style="margin-top:17vh"><div class="eyebrow" style="color:#caa67f">the door is small</div><h1>Come make<br>a little noise.</h1><p>A private workshop for your sketches, arrangements, notes and listening experiments.</p></div><div class="auth-motif"></div></section><section class="auth-box"><div class="auth-card"><a href="/" style="font:11px var(--mono);color:rgba(36,30,29,.52)">← back to the reading room</a><div class="tabs" style="margin-top:30px"><button class="active" data-mode="login">sign in</button><button data-mode="signup">sign up</button></div><h2 id="authTitle" style="font-size:48px;margin-bottom:22px">Return to your room</h2><div id="authError" class="error" hidden></div><form id="authForm"><div class="field signup-only" hidden><label>name</label><input name="display_name" autocomplete="name" maxlength="80"></div><div class="field"><label>email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>password</label><input name="password" type="password" autocomplete="current-password" minlength="10" required></div><button id="authSubmit" class="btn btn-solid" type="submit" style="width:100%">Enter LOOM</button></form><p class="auth-note">Passwords are hashed with Argon2id. Sessions are server-side and project data is private to your account.</p></div></section></main><script src="/assets/site.js"></script></body></html>
